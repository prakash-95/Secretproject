<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>One Important Question ❤️</title>
<style>
*{box-sizing:border-box}body{margin:0;height:100vh;overflow:hidden;font-family:Arial,sans-serif;background:linear-gradient(135deg,#ffd6e7,#fff0f5);display:flex;align-items:center;justify-content:center}
.card{text-align:center;background:#ffffffcc;padding:50px 35px;border-radius:30px;box-shadow:0 20px 60px #0000001f;width:min(90%,500px);position:relative;z-index:2}
.heart{font-size:70px;animation:beat 1.2s infinite}h1{font-size:36px;color:#d6336c;margin:20px 0 10px}p{color:#777;font-size:18px;margin-bottom:35px}
.buttons{display:flex;justify-content:center;gap:20px;height:60px}button{border:0;border-radius:50px;padding:15px 30px;font-size:18px;font-weight:bold;cursor:pointer}
#yes{background:#ff4d88;color:white;box-shadow:0 8px 20px #ff4d884d;transition:transform .2s}#no{background:#eee;color:#555;position:fixed;transition:left .18s ease,top .18s ease}
.success{display:none}.success h1{font-size:45px}.confetti{position:fixed;font-size:25px;animation:fall 3s linear forwards;pointer-events:none}
@keyframes beat{50%{transform:scale(1.15)}}@keyframes fall{from{transform:translateY(-50px) rotate(0);opacity:1}to{transform:translateY(110vh) rotate(720deg);opacity:0}}
</style>
</head>
<body>
<div class="card" id="question">
<div class="heart">❤️</div><h1>Will you go out with me?</h1>
<p>I have a very important question for you...</p>
<div class="buttons"><button id="yes">YES ❤️</button><button id="no">NO 😈</button></div>
</div>
<div class="card success" id="success"><div class="heart">🥰</div><h1>YAAAAAY!!! ❤️</h1><p>I knew you'd say yes 😌<br><br>It's a date!</p></div>
<script>
const no=document.getElementById('no'),yes=document.getElementById('yes'),q=document.getElementById('question'),s=document.getElementById('success');let n=0;
function move(){n++;let x=Math.max(10,Math.random()*(innerWidth-no.offsetWidth-20)),y=Math.max(10,Math.random()*(innerHeight-no.offsetHeight-20));no.style.left=x+'px';no.style.top=y+'px';
let m=['NO 😈','Are you sure?','Really??','Think again 😭','Nice try 😂','Nope.','You can’t catch me','JUST SAY YES 😭','Why are you like this','Okay you’re persistent 💀'];no.textContent=m[Math.min(n,m.length-1)];yes.style.transform=`scale(${1+n*.08})`}
no.addEventListener('mouseenter',move);no.addEventListener('touchstart',e=>{e.preventDefault();move()});
yes.onclick=()=>{q.style.display='none';s.style.display='block';for(let i=0;i<80;i++){let c=document.createElement('div');c.className='confetti';c.textContent=['❤️','💖','💕','✨','🥰','🎉'][Math.floor(Math.random()*6)];c.style.left=Math.random()*100+'vw';c.style.animationDelay=Math.random()*1.5+'s';document.body.appendChild(c);setTimeout(()=>c.remove(),4000)}};
</script>
</body>
</html>
